<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mark Scope - 100% 离线单文件 Markdown 编辑与阅读器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  
  <!-- Inlined Vditor Stylesheet -->
  <style id="vditorIndexStyle">
    /* __INLINE_VDITOR_CSS__ */
  </style>

  <!-- Inlined KaTeX Stylesheet (with base64 fonts) -->
  <style id="vditorKatexStyle">
    /* __INLINE_KATEX_CSS__ */
  </style>

  <!-- Inlined Highlight.js Stylesheet -->
  <style id="vditorHljsStyle">
    /* __INLINE_HLJS_CSS__ */
  </style>

  <!-- Inlined Mark Scope Custom Shell Styles -->
  <style id="markScopeCustomStyle">
    /* __INLINE_SHELL_CSS__ */
  </style>
</head>
<body class="theme-dark">

  <!-- Crash Recovery Notification Banner -->
  <div id="crash-recovery-banner" class="recovery-banner">
    <div class="recovery-banner-content">
      <span>⚠️</span>
      <span id="recovery-banner-desc">检测到崩溃/异常退出前未保存的草稿。是否立即恢复？</span>
    </div>
    <div class="recovery-banner-actions">
      <button id="btn-restore-draft" class="btn-banner btn-banner-restore">立即恢复</button>
      <button id="btn-discard-draft" class="btn-banner btn-banner-discard">放弃草稿</button>
    </div>
  </div>

  <!-- Top Application Header & Toolbar -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-brand">
        <span class="brand-icon">📝</span>
        <span>Mark Scope</span>
      </div>

      <!-- File Operations -->
      <button id="btn-open-file" class="btn-cta" title="打开本地 Markdown 文件 (Ctrl+O)">
        <span>📂 打开</span>
      </button>
      <button id="btn-save-file" class="btn-cta btn-primary" title="保存文档到本地磁盘 (Ctrl+S)">
        <span>💾 保存</span>
      </button>
      <button id="btn-save-as" class="btn-cta" title="另存为新的 Markdown 文件 (Ctrl+Shift+S)">
        <span>另存为...</span>
      </button>

      <!-- Export Dropdown -->
      <div class="dropdown">
        <button id="btn-export-dropdown" class="btn-cta" title="导出为其他独立格式">
          <span>📤 导出 ▾</span>
        </button>
        <div id="export-menu" class="dropdown-menu">
          <div id="action-export-html" class="dropdown-item">
            <span>🌐 导出为独立 HTML</span>
          </div>
          <div id="action-export-pdf" class="dropdown-item">
            <span>📄 导出为 PDF (打印排版)</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Window-Centered File Title (Decoupled from Left & Right Buttons) -->
    <div class="header-window-center">
      <div class="file-title-wrapper" title="当前正在编辑的文件">
        <span id="current-doc-title">欢迎体验_MarkScope.md</span>
        <span id="file-dirty-indicator" class="file-dirty-badge" title="有未保存修改">●</span>
      </div>
    </div>

    <!-- Right: View & Theme Controls -->
    <div class="header-right">
      <button id="btn-toggle-full-width" class="btn-cta" title="切换正文全宽模式 / 标准舒适阅读宽度">
        <span>📏 全宽</span>
      </button>
      <button id="btn-reader-mode" class="btn-cta" title="进入纯净无干扰阅读模式">
        <span>📖 阅读模式</span>
      </button>
      <button id="btn-toggle-theme" class="btn-cta" title="切换深色/浅色视觉主题">
        <span>🌙 深色</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="app-workspace">
    <!-- Editor Viewport (Full width available) -->
    <section class="editor-viewport">
      <div id="vditor-container"></div>
    </section>
  </main>

  <!-- Floating Right-hand Outline & Stats Widget -->
  <aside id="ms-float-outline-container" class="ms-float-outline-container">
    <!-- Collapsed State: Vertical Dashes (Screenshot 2) -->
    <div id="ms-outline-dashes" class="ms-outline-dashes" title="悬停展开大纲与统计面板"></div>

    <!-- Expanded State: Floating Panel (Screenshot 1) -->
    <div id="ms-outline-panel" class="ms-outline-panel">
      <!-- Panel Header with Tabs & Pin -->
      <div class="ms-panel-header">
        <div class="ms-tab-group">
          <button id="tab-btn-outline" class="ms-tab-btn active" title="大纲目录">
            <span class="tab-icon">T</span>
            <span class="tab-label">Outline</span>
          </button>
          <button id="tab-btn-stats" class="ms-tab-btn" title="文档统计">
            <svg class="tab-icon" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
              <path d="M4 19h16v2H4zm3-4h2v4H7zm4-8h2v12h-2zm4 4h2v8h-2z"/>
            </svg>
            <span class="tab-label">Stats</span>
          </button>
        </div>
        <button id="btn-pin-outline" class="ms-pin-btn" title="固定面板 (保持显现) / 再次点击取消固定">
          <svg class="pin-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M16 9V4l1 0V2H7v2l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1.03 1 1.03-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/>
          </svg>
        </button>
      </div>

      <!-- Tab View 1: Outline with 6-level Heading Filter -->
      <div id="view-tab-outline" class="ms-tab-view active">
        <!-- 6-level Heading Filter Slider Track -->
        <div class="level-filter-wrapper" title="点击选择大纲显示的最大标题层级 (H1~H6)">
          <div class="level-track-bg"></div>
          <div id="level-track-fill" class="level-track-fill"></div>
          <div class="level-dots-container">
            <button class="level-dot active" data-level="1" title="仅显示到 H1">1</button>
            <button class="level-dot active" data-level="2" title="显示到 H2">2</button>
            <button class="level-dot active" data-level="3" title="显示到 H3">3</button>
            <button class="level-dot active" data-level="4" title="显示到 H4">4</button>
            <button class="level-dot active" data-level="5" title="显示到 H5">5</button>
            <button class="level-dot active" data-level="6" title="显示到 H6">6</button>
          </div>
        </div>
        <!-- Dynamic Outline Tree -->
        <div id="float-outline-list" class="float-outline-list"></div>
      </div>

      <!-- Tab View 2: Stats (仿照大纲形式，每行一项指标) -->
      <div id="view-tab-stats" class="ms-tab-view">
        <div class="float-stats-list">
          <div class="stats-row"><span class="stats-label">字数：</span><span id="stat-val-words" class="stats-value">0</span></div>
          <div class="stats-row"><span class="stats-label">句数：</span><span id="stat-val-sentences" class="stats-value">0</span></div>
          <div class="stats-row"><span class="stats-label">段数：</span><span id="stat-val-paragraphs" class="stats-value">0</span></div>
          <div class="stats-row"><span class="stats-label">字符数：</span><span id="stat-val-chars" class="stats-value">0</span></div>
          <div class="stats-row"><span class="stats-label">最后保存：</span><span id="stat-val-last-saved" class="stats-value">-</span></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Bottom Statusbar (HUD - Simplified) -->
  <footer class="app-statusbar">
    <div class="statusbar-left">
      <span id="stat-save-status" class="status-item status-clean">✓ 已存盘</span>
      <span>|</span>
      <span class="status-item">UTF-8</span>
    </div>

    <div class="statusbar-right">
      <span id="stat-mode">即时渲染 (IR)</span>
      <span>|</span>
      <span>Mark Scope v1</span>
    </div>
  </footer>

  <!-- Floating Exit Button for Reader Mode -->
  <button id="btn-exit-reader-mode" class="btn-floating-exit-reader" title="退出阅读模式 (快捷键: Esc)">
    <span>✕ 退出阅读模式 (Esc)</span>
  </button>

  <!-- Drag & Drop Fullscreen Overlay -->
  <div id="drag-drop-overlay" class="drag-overlay">
    <div class="drag-overlay-box">
      <div class="drag-overlay-icon">📥</div>
      <div class="drag-overlay-text">释放鼠标即可打开该 Markdown 文件</div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Hidden Fallback File Input -->
  <input type="file" id="file-picker-input" accept=".md,.markdown,.mdown,.mkd,.txt" style="display:none">

  <!-- =====================================================================
       Inlined JavaScript Bundles (with standard IDs to prevent network fetch)
       ===================================================================== -->
  <script id="vditorLuteScript">
    /* __INLINE_LUTE_JS__ */
  </script>
  <script id="vditorIconScript">
    /* __INLINE_ANT_ICONS_JS__ */
  </script>
  <script id="vditorHljsScript">
    /* __INLINE_HLJS_JS__ */
  </script>
  <script id="vditorKatexScript">
    /* __INLINE_KATEX_JS__ */
  </script>
  <script id="vditorMermaidScript">
    /* __INLINE_MERMAID_JS__ */
  </script>
  <script id="vditorCoreScript">
    /* __INLINE_VDITOR_JS__ */
  </script>

  <!-- Inlined Application Controllers -->
  <script id="markScopeAppScripts">
    /* __INLINE_DRAFT_MANAGER_JS__ */
    /* __INLINE_FILE_IO_JS__ */
    /* __INLINE_OUTLINE_JS__ */
    /* __INLINE_TABLE_MANAGER_JS__ */
    /* __INLINE_STATUSBAR_JS__ */
    /* __INLINE_APP_JS__ */
  </script>
</body>
</html>
